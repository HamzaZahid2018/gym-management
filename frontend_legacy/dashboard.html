<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dashboard — GymPro</title>
<link rel="stylesheet" href="css/style.css?v=3"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="loading-screen" id="ls"><div class="spinner"></div><div class="loading-txt">Loading dashboard…</div></div>
<div class="app-layout" id="app" style="display:none">
  <div id="sb"></div>
  <div class="main-content">
    <div id="tb"></div>
    <div class="page-wrap">
      <div id="alert-box"></div>
      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card blue">
          <div class="stat-ico blue"><svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
          <div><div class="stat-val" id="s-total">—</div><div class="stat-lbl">Total Customers</div></div>
        </div>
        <div class="stat-card green">
          <div class="stat-ico green"><svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
          <div><div class="stat-val" id="s-active">—</div><div class="stat-lbl">Active Members</div></div>
        </div>
        <div class="stat-card orange">
          <div class="stat-ico orange"><svg viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></div>
          <div><div class="stat-val" id="s-unpaid">—</div><div class="stat-lbl">Unpaid Payments</div></div>
        </div>
        <div class="stat-card red">
          <div class="stat-ico red"><svg viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
          <div><div class="stat-val" id="s-overdue">—</div><div class="stat-lbl">Overdue Payments</div></div>
        </div>
      </div>
      <!-- Charts -->
      <div class="charts-grid">
        <div class="card">
          <div class="card-hd">
            <span class="card-title"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Monthly Revenue</span>
            <span id="total-rev" style="font-size:13px;color:var(--green);font-weight:700"></span>
          </div>
          <div class="chart-wrap"><canvas id="rev-chart"></canvas></div>
        </div>
        <div class="card">
          <div class="card-hd">
            <span class="card-title"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Payment Breakdown</span>
          </div>
          <div class="chart-wrap"><canvas id="status-chart"></canvas></div>
        </div>
      </div>
      <!-- Bottom -->
      <div class="charts-grid">
        <div class="card" style="padding:0">
          <div class="card-hd" style="padding:18px 20px 0"><span class="card-title">Recent Payments</span><a href="payments.html" class="card-link">View all →</a></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Customer</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
              <tbody id="recent-body"><tr><td colspan="4" style="text-align:center;padding:30px;color:var(--t3)">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <div class="card-hd"><span class="card-title">New Members <span style="font-size:11px;color:var(--t3);font-weight:400">(last 30 days)</span></span><a href="customers.html" class="card-link">View all →</a></div>
          <div id="new-members" style="display:flex;flex-direction:column;gap:2px"><div style="text-align:center;padding:24px;color:var(--t3)">Loading…</div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script>
if(!requireAuth()){}
async function init(){
  document.getElementById('sb').innerHTML=renderSidebar('dashboard');
  const u=JSON.parse(localStorage.getItem('user')||'{}');
  document.getElementById('tb').innerHTML=renderTopbar(`Welcome back, ${u.first_name||'Admin'}! &#128075;`,'Here\'s your gym overview for today');
  try{
    const[stats,rev,breakdown,recent,newM]=await Promise.all([dashboardService.getStats(),dashboardService.getRevenueStats(),dashboardService.getPaymentStatusBreakdown(),dashboardService.getRecentPayments(),dashboardService.getNewMembers()]);
    renderStats(stats);renderRevChart(rev);renderStatusChart(breakdown);renderRecent(recent);renderNewMembers(newM);
  }catch(e){showAlert(document.getElementById('alert-box'),'error','Could not load dashboard data. Make sure the backend is running on port 8000.')}
  document.getElementById('ls').style.display='none';
  document.getElementById('app').style.display='flex';
}
function renderStats(s){
  document.getElementById('s-total').textContent=s.total_customers;
  document.getElementById('s-active').textContent=s.active_members;
  document.getElementById('s-unpaid').textContent=s.total_unpaid;
  document.getElementById('s-overdue').textContent=s.overdue_payments;
}
function renderRevChart(data){
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const labels=(data.monthly_revenue||[]).map(d=>mo[d.month-1]);
  const vals=(data.monthly_revenue||[]).map(d=>d.revenue);
  document.getElementById('total-rev').textContent='Total: '+formatCurrency(vals.reduce((a,b)=>a+b,0));
  new Chart(document.getElementById('rev-chart').getContext('2d'),{type:'bar',
    data:{labels,datasets:[{label:'Revenue',data:vals,backgroundColor:'rgba(79,70,229,0.15)',borderColor:'#4f46e5',borderWidth:2,borderRadius:6,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' Rs '+c.parsed.y.toLocaleString()}}},
      scales:{x:{grid:{display:false},ticks:{color:'#94a3b8',font:{size:11}}},y:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{color:'#94a3b8',font:{size:11},callback:v=>'Rs '+v.toLocaleString()}}}}});
}
function renderStatusChart(data){
  const clr={paid:'#059669',unpaid:'#dc2626',late:'#d97706',pending:'#b45309'};
  new Chart(document.getElementById('status-chart').getContext('2d'),{type:'doughnut',
    data:{labels:data.map(d=>d.status.charAt(0).toUpperCase()+d.status.slice(1)),datasets:[{data:data.map(d=>d.count),backgroundColor:data.map(d=>clr[d.status]||'#4f46e5'),borderColor:'#ffffff',borderWidth:3,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{position:'bottom',labels:{color:'#475569',padding:14,font:{size:12},boxWidth:10,boxHeight:10}}}}});
}
function renderRecent(payments){
  const tb=document.getElementById('recent-body');
  if(!payments.length){tb.innerHTML=`<tr><td colspan="4"><div class="empty"><div class="empty-ico">&#128179;</div><p>No payments yet</p></div></td></tr>`;return}
  tb.innerHTML=payments.slice(0,6).map(p=>`<tr>
    <td><div style="font-weight:600">${p.customer_details?.first_name||''} ${p.customer_details?.last_name||''}</div><div style="font-size:11.5px;color:var(--t3)">${p.customer_details?.email||''}</div></td>
    <td style="font-weight:700;color:var(--green)">${formatCurrency(p.amount)}</td>
    <td>${badge(p.payment_status)}</td>
    <td style="color:var(--t3)">${formatDate(p.payment_date||p.created_at)}</td>
  </tr>`).join('');
}
function renderNewMembers(members){
  const c=document.getElementById('new-members');
  if(!members.length){c.innerHTML=`<div class="empty"><div class="empty-ico">&#128100;</div><p>No new members</p></div>`;return}
  c.innerHTML=members.slice(0,6).map(m=>`<div class="member-row"><div class="avatar">${getInitials(m.first_name,m.last_name)}</div><div style="flex:1;min-width:0"><div class="member-name">${m.first_name} ${m.last_name}</div><div class="member-email">${m.email}</div></div>${badge(m.membership_type)}</div>`).join('');
}
init();
</script>
</body>
</html>
