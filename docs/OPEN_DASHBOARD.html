<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=http://127.0.0.1:8000/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Gym Management System...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        .link {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        .link:hover {
            transform: translateY(-2px);
        }
        .info {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .info h3 {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        .info code {
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        .info a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>🚀 Opening Gym Management System...</h1>
        <p>Redirecting to landing page...</p>
        
        <div class="info">
            <h3>If the page doesn't open automatically:</h3>
            <a href="http://127.0.0.1:8000/" class="link">Click Here to Open Landing Page</a>
            
            <div style="margin-top: 20px; font-size: 13px;">
                <p><strong>Quick Links:</strong></p>
                <p><a href="http://127.0.0.1:8000/static/login.html">Login Page</a></p>
                <p><a href="http://127.0.0.1:8000/static/register.html">Create Account</a></p>
            </div>
            
            <div style="margin-top: 20px; font-size: 12px; opacity: 0.8;">
                <p>⚠️ Make sure the server is running!</p>
                <p>Run <code>START_GYM_SYSTEM.bat</code> if needed</p>
            </div>
        </div>
    </div>
    
    <script>
        // Fallback redirect after 2 seconds
        setTimeout(function() {
            window.location.href = 'http://127.0.0.1:8000/';
        }, 2000);
    </script>
</body>
</html>
